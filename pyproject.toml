[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iga"
version = "1.0.0"
description = "Vision — the one-token organism: a 297M language creature that lives in one continuous stream and learns while you talk to it."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["torch>=2.0", "numpy>=1.24", "tokenizers>=0.15"]

[project.optional-dependencies]
crafter = ["crafter"]
render = ["pillow", "matplotlib"]

[tool.setuptools]
packages = ["iga"]
